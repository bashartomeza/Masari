name: Admin CI

on:
  pull_request:
  push:
    branches: [production-readiness]

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_APP_ENV: production
      VITE_ENABLE_DEMO_FEATURES: "false"
      VITE_API_BASE_URL: https://api.staging.masari.invalid
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck:admin
      - run: npm run test:admin
      - run: npm run build:admin
      - name: Scan production admin output
        run: npm run security:artifacts -- --admin-dir apps/admin/dist
