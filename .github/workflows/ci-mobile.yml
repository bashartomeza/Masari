name: Flutter Android CI

on:
  pull_request:
  push:
    branches: [production-readiness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Read canonical mobile toolchain versions
        id: versions
        shell: bash
        run: |
          echo "java=$(cat .java-version)" >> "$GITHUB_OUTPUT"
          echo "flutter=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.java }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.versions.outputs.flutter }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter gen-l10n
        working-directory: apps/mobile
      - run: dart format --set-exit-if-changed .
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
      - name: Build unsigned production-like APK
        working-directory: apps/mobile
        run: >-
          flutter build apk --release
          --dart-define=APP_ENV=production
          --dart-define=ENABLE_DEMO_FEATURES=false
          --dart-define=API_BASE_URL=https://api.staging.masari.invalid
      - name: Scan production-like APK
        run: npm run security:artifacts -- --apk apps/mobile/build/app/outputs/flutter-apk/app-release.apk
