name: Security and Configuration CI

on:
  pull_request:
  push:
    branches: [production-readiness]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ci:workflows
      - run: npm run security:scan
      - run: npm run security:audit
      - run: npm run test:tooling
      - name: Generate Prisma client for configuration tests
        run: npm run prisma:generate
        env:
          DATABASE_URL: mysql://127.0.0.1:3306/masari_ci
      - name: Production configuration isolation tests
        run: npm run test -- --run src/tests/config.test.ts src/tests/environmentRoutes.test.ts src/tests/httpSecurity.test.ts
      - name: Lockfile remains reproducible
        run: git diff --exit-code -- package-lock.json
