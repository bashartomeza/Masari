name: masari-staging-simulation

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: masari_staging_sim
      MYSQL_USER: masari_staging
      MYSQL_PASSWORD: ${MYSQL_STAGING_PASSWORD:?set MYSQL_STAGING_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_STAGING_ROOT_PASSWORD:?set MYSQL_STAGING_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - staging-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [private]

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migration
    environment:
      DATABASE_URL: ${STAGING_DATABASE_URL:?set STAGING_DATABASE_URL}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [private]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      APP_ENV: staging
      ENABLE_DEMO_FEATURES: "false"
      APP_RELEASE: ${APP_RELEASE:?set APP_RELEASE}
      DATABASE_URL: ${STAGING_DATABASE_URL:?set STAGING_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?set REFRESH_TOKEN_PEPPER}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      TRUST_PROXY: ${TRUST_PROXY:?set TRUST_PROXY}
      LOG_LEVEL: info
      PORT: "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3001:3000"
    stop_grace_period: 15s
    networks: [private]

networks:
  private:
    internal: true

volumes:
  staging-mysql:
